<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SmartAccess Parking{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        :root {
            --parking-ink: #183247;
            --parking-navy: #102a43;
            --parking-blue: #0b6f9f;
            --parking-teal: #2fc6b5;
            --parking-muted: #718293;
            --parking-canvas: #f3f7fa;
            --parking-border: #e2eaf0;
        }

        body {
            min-height: 100vh;
            color: var(--parking-ink);
            background: radial-gradient(circle at 88% 0%, #e4f3f7 0, transparent 28rem), var(--parking-canvas);
            font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        .app-navbar {
            background: linear-gradient(112deg, #102a43 0%, #123c58 100%);
            box-shadow: 0 8px 28px rgba(16, 42, 67, .14);
        }

        .app-navbar .navbar-brand {
            display: inline-flex;
            align-items: center;
            gap: .75rem;
            color: #fff;
            font-size: 1.02rem;
            font-weight: 700;
            letter-spacing: -.02em;
        }

        .brand-mark {
            display: grid;
            width: 2.5rem;
            height: 2.5rem;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, .24);
            border-radius: .8rem;
            color: #073a4c;
            background: linear-gradient(145deg, #5ce0c3, #9df0d7);
            font-size: 1.1rem;
            font-weight: 800;
            box-shadow: 0 5px 16px rgba(47, 198, 181, .2);
        }

        .app-navbar .nav-link {
            padding: .58rem .78rem;
            border-radius: .65rem;
            color: rgba(255, 255, 255, .76);
            font-size: .91rem;
            font-weight: 500;
            transition: background-color .18s ease, color .18s ease;
        }

        .app-navbar .nav-link:hover,
        .app-navbar .nav-link:focus-visible {
            color: #fff;
            background: rgba(255, 255, 255, .1);
        }

        .app-navbar .navbar-toggler {
            border-color: rgba(255, 255, 255, .28);
        }

        .app-main {
            max-width: 1240px;
        }

        .page-title {
            margin: 0;
            color: var(--parking-ink);
            font-size: clamp(1.65rem, 2.5vw, 2.25rem);
            font-weight: 750;
            letter-spacing: -.04em;
        }

        .app-card {
            overflow: hidden;
            border: 1px solid var(--parking-border);
            border-radius: 1.15rem;
            background: #fff;
            box-shadow: 0 12px 34px rgba(29, 58, 79, .06);
        }

        .app-table thead th {
            border-bottom: 1px solid var(--parking-border);
            color: #667b8d;
            background: #f7f9fb;
            font-size: .76rem;
            font-weight: 700;
            letter-spacing: .055em;
            text-transform: uppercase;
        }

        .app-table tbody td {
            border-color: #edf1f4;
            color: #29465b;
        }

        .django-form p {
            margin-bottom: 1.15rem;
        }

        .django-form p label {
            display: block;
            margin-bottom: .4rem;
            color: #344f63;
            font-size: .9rem;
            font-weight: 650;
        }

        .django-form input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]),
        .django-form select,
        .django-form textarea {
            display: block;
            width: 100%;
            min-height: 2.8rem;
            padding: .62rem .82rem;
            border: 1px solid #d6e1e9;
            border-radius: .7rem;
            color: var(--parking-ink);
            background-color: #fff;
            transition: border-color .18s ease, box-shadow .18s ease;
        }

        .django-form textarea {
            min-height: 7rem;
        }

        .django-form input:focus,
        .django-form select:focus,
        .django-form textarea:focus {
            border-color: #69b8c9;
            outline: 0;
            box-shadow: 0 0 0 .22rem rgba(11, 111, 159, .12);
        }

        .django-form input[type="checkbox"],
        .django-form input[type="radio"] {
            accent-color: var(--parking-blue);
        }

        .django-form .helptext {
            display: block;
            margin-top: .35rem;
            color: var(--parking-muted);
            font-size: .82rem;
        }

        .django-form .errorlist {
            margin: .35rem 0 0;
            padding: 0;
            color: #b42318;
            font-size: .85rem;
            list-style: none;
        }

        .app-message {
            border: 0;
            border-left: 4px solid #3b9cbe;
            border-radius: .65rem;
            color: #244a60;
            background: #e9f5f8;
        }

        @media (max-width: 1199.98px) {
            .app-navbar .navbar-nav {
                padding-top: .65rem;
            }
        }
    </style>
</head>

<body>
    <header class="app-navbar sticky-top">
        <nav class="navbar navbar-expand-xl navbar-dark py-3">
            <div class="container-fluid px-3 px-lg-4">
                <div class="navbar-brand">
                    <span class="brand-mark" aria-hidden="true">P</span>
                    <span>SmartAccess Parking</span>
                </div>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation"
                    aria-controls="mainNavigation" aria-expanded="false" aria-label="Abrir navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="mainNavigation">
                    <nav class="navbar-nav gap-xl-1">
                        <a class="nav-link" href="{% url 'usuarios:usuario_list' %}">Usuarios</a>
                        <a class="nav-link" href="{% url 'usuarios:vehiculo_list' %}">Vehículos</a>
                        <a class="nav-link"
                            href="{% url 'estacionamientos:estacionamiento_list' %}">Estacionamientos</a>
                        <a class="nav-link" href="{% url 'estacionamientos:sensor_list' %}">Sensores</a>
                        <a class="nav-link" href="{% url 'registros:registro_list' %}">Registros de uso</a>
                        <a class="nav-link" href="{% url 'registros:captura_list' %}">Capturas de placa</a>
                        <a class="nav-link" href="{% url 'registros:incidencia_list' %}">Incidencias</a>
                    </nav>
                </div>
            </div>
        </nav>
    </header>

    {% if messages %}
    <div class="container app-main pt-4">
        {% for message in messages %}
        <div class="alert app-message shadow-sm mb-2" role="status">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <main class="container app-main py-4 py-lg-5">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
