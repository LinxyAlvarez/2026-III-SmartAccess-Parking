{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="mx-auto" style="max-width: 800px;">
    <div class="app-card p-4 p-md-5">
        <h2 class="page-title mb-4">{{ title }}</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="django-form">
                {{ form.as_p }}
            </div>

            <div class="d-flex flex-wrap gap-2 border-top pt-4 mt-4">
                <button class="btn btn-primary rounded-pill px-4" type="submit">Guardar</button>
                <a class="btn btn-light rounded-pill px-4" href="{{ view.success_url }}">Cancelar</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
