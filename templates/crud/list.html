{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<section>
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <h2 class="page-title">{{ title }}</h2>
        <a class="btn btn-primary rounded-pill px-4" href="{% url create_url %}">Crear registro</a>
    </div>

    <div class="app-card">
        <div class="table-responsive">
            <table class="table app-table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th class="ps-4 py-3">Registro</th>
                        <th class="pe-4 py-3 text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in objects %}
                        <tr>
                            <td class="ps-4 py-3">{{ item }}</td>
                            <td class="pe-4 py-3">
                                <div class="d-flex justify-content-end gap-2">
                                    <a class="btn btn-sm btn-light rounded-pill px-3" href="{% url update_url item.pk %}">Editar</a>
                                    <a class="btn btn-sm btn-outline-danger rounded-pill px-3" href="{% url delete_url item.pk %}">Eliminar</a>
                                </div>
                            </td>
                        </tr>
                    {% empty %}
                        <tr>
                            <td class="py-4 text-center text-secondary" colspan="2">No hay registros.</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</section>
{% endblock %}
