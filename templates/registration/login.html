{% extends "base.html" %}

{% block title %}Iniciar sesión | SmartAccess Parking{% endblock %}

{% block content %}
<h2>Iniciar sesión</h2>

{% if form.errors %}
    <p role="alert">El nombre de usuario o la contraseña no son válidos.</p>
{% endif %}

<form method="post" action="{% url 'usuarios:login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
    {% endif %}
    <button type="submit">Iniciar sesión</button>
</form>
{% endblock %}
