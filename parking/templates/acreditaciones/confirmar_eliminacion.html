<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eliminar acreditación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body { min-height: 100vh; color: #183247; background: radial-gradient(circle at 88% 0%, #e4f3f7 0, transparent 28rem), #f3f7fa; font-family: Inter, "Segoe UI", system-ui, sans-serif; }
        .brand-lockup { display: flex; align-items: center; gap: .75rem; margin-bottom: 2.5rem; color: #102a43; font-weight: 750; letter-spacing: -.02em; }
        .brand-mark { display: grid; width: 2.6rem; height: 2.6rem; place-items: center; border-radius: .8rem; color: #073a4c; background: linear-gradient(145deg, #5ce0c3, #9df0d7); font-size: .9rem; font-weight: 800; }
        .page-title { color: #183247; font-size: clamp(1.65rem, 2.5vw, 2.2rem); font-weight: 750; letter-spacing: -.04em; }
        .surface-card { border: 1px solid #e2eaf0; border-radius: 1.15rem; background: #fff; box-shadow: 0 12px 34px rgba(29, 58, 79, .06); }
    </style>
</head>
<body>
    <main class="container py-4 py-lg-5">
        <div class="brand-lockup"><span class="brand-mark" aria-hidden="true">SP</span><span>SmartAccess Parking</span></div>
        <section class="surface-card mx-auto p-4 p-md-5" style="max-width: 680px;">
            <div class="d-flex align-items-start gap-3">
                <div class="rounded-circle bg-danger-subtle text-danger d-grid flex-shrink-0" style="width: 2.75rem; height: 2.75rem; place-items: center; font-weight: 800;" aria-hidden="true">!</div>
                <div>
                    <h1 class="page-title mb-3">Confirmar eliminación</h1>
                    <p class="text-secondary mb-0">
                        ¿Seguro que deseas eliminar la acreditación de
                        {{ acreditacion.usuario }}?
                    </p>
                </div>
            </div>

            <form class="border-top pt-4 mt-4" method="post">
                {% csrf_token %}
                <div class="d-flex flex-wrap gap-2">
                    <button class="btn btn-danger rounded-pill px-4" type="submit">Confirmar eliminación</button>
                    <a class="btn btn-light rounded-pill px-4" href="{% url 'lista_acreditaciones' %}">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
