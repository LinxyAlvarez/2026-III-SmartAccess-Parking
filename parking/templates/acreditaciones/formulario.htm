<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de acreditación</title>
</head>
<body>
    <h1>Registrar o editar acreditación</h1>

    <form method="post">
        {% csrf_token %}
        {{ formulario.as_p }}

        <button type="submit">Guardar acreditación</button>
        <a href="{% url 'lista_acreditaciones' %}">Cancelar</a>
    </form>
</body>
</html>
