<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuevo usuario - SmartAccess Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body { min-height: 100vh; color: #183247; background: radial-gradient(circle at 88% 0%, #e4f3f7 0, transparent 28rem), #f3f7fa; font-family: Inter, "Segoe UI", system-ui, sans-serif; }
        .brand-lockup { display: flex; align-items: center; gap: .75rem; margin-bottom: 2.5rem; color: #102a43; font-weight: 750; letter-spacing: -.02em; }
        .brand-mark { display: grid; width: 2.6rem; height: 2.6rem; place-items: center; border-radius: .8rem; color: #073a4c; background: linear-gradient(145deg, #5ce0c3, #9df0d7); font-size: .9rem; font-weight: 800; }
        .page-title { color: #183247; font-size: clamp(1.65rem, 2.5vw, 2.2rem); font-weight: 750; letter-spacing: -.04em; }
        .surface-card { border: 1px solid #e2eaf0; border-radius: 1.15rem; background: #fff; box-shadow: 0 12px 34px rgba(29, 58, 79, .06); }
        .visual-form p { margin-bottom: 1.15rem; }
        .visual-form p label { display: block; margin-bottom: .4rem; color: #344f63; font-size: .9rem; font-weight: 650; }
        .visual-form input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]), .visual-form select, .visual-form textarea { display: block; width: 100%; min-height: 2.8rem; padding: .62rem .82rem; border: 1px solid #d6e1e9; border-radius: .7rem; color: #183247; background: #fff; }
        .visual-form textarea { min-height: 7rem; }
        .visual-form input[type="checkbox"], .visual-form input[type="radio"] { accent-color: #0b6f9f; }
        .visual-form .helptext { display: block; margin-top: .35rem; color: #718293; font-size: .82rem; }
        .visual-form .errorlist { margin: .35rem 0 0; padding: 0; color: #b42318; font-size: .85rem; list-style: none; }
    </style>
</head>
<body>
    <main class="container py-4 py-lg-5">
        <div class="brand-lockup"><span class="brand-mark" aria-hidden="true">SP</span><span>SmartAccess Parking</span></div>
        <section class="surface-card mx-auto p-4 p-md-5" style="max-width: 800px;">
            <h1 class="page-title mb-4">Registrar usuario</h1>

            <form class="visual-form" method="post">
                {% csrf_token %}

                {{ formulario.as_p }}

                <div class="d-flex flex-wrap gap-2 border-top pt-4 mt-4">
                    <button class="btn btn-primary rounded-pill px-4" type="submit">Guardar usuario</button>
                    <a class="btn btn-light rounded-pill px-4" href="{% url 'lista_usuarios' %}">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
