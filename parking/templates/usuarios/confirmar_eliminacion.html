<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar usuario - SmartAccess Parking</title>
</head>
<body>
    <h1>Eliminar usuario</h1>

    <p>
        ¿Seguro que deseas eliminar a
        {{ usuario.nombre }} {{ usuario.apellido_paterno }}?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar eliminación</button>
    </form>

    <a href="{% url 'lista_usuarios' %}">Cancelar</a>
</body>
</html>
